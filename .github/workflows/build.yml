name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: unzip -o tiktok-editor-app.zip -d project
      - name: Probe ffmpeg-kit sources 2
        run: |
          FILE=$(find project -name MainActivity.kt | head -n 1)
          echo "FILE=$FILE lines=$(wc -l < "$FILE")"
          echo "=== FFmpeg usage with context ==="
          grep -n -B 4 -A 8 "FFmpegKit\|FFprobeKit\|ReturnCode" "$FILE" | head -n 200
          echo "=== search.maven.org arthenica ==="
          curl -s "https://search.maven.org/solrsearch/select?q=g:com.arthenica&rows=20&wt=json" | head -c 2000; echo
          echo "=== search.maven.org ffmpeg-kit ==="
          curl -s "https://search.maven.org/solrsearch/select?q=ffmpeg-kit&rows=20&wt=json" | head -c 2000; echo
          echo "=== github api arthenica repo ==="
          curl -s -w " HTTP:%{http_code}\n" https://api.github.com/repos/arthenica/ffmpeg-kit | head -c 1000; echo
          echo "=== github api tanersener releases ==="
          curl -s "https://api.github.com/repos/tanersener/ffmpeg-kit/releases?per_page=2" | grep -E '"name"|"browser_download_url"' | head -n 60
          echo "=== pom HEAD checks ==="
          for v in 6.0 6.0-2 5.1 5.1-2.LTS 6.0.LTS 4.5; do echo -n "$v: "; curl -s -o /dev/null -w "%{http_code}\n" https://repo.maven.apache.org/maven2/com/arthenica/ffmpeg-kit-video/$v/ffmpeg-kit-video-$v.pom; done
      - name: Fix misplaced ndk block
        run: |
          perl -0777 -i -pe 's/^[ \t]*ndk[ \t]*\{[^}]*\}[ \t]*\n//gm' project/tiktok-editor-app/app/build.gradle.kts
          echo "=== after fix, lines 25-50 ==="
          cat -n project/tiktok-editor-app/app/build.gradle.kts | sed -n '25,50p'
      - name: Build debug APK
        run: |
          ls -R project | head -n 100
          APP_DIR=$(dirname $(find project -maxdepth 3 -name gradlew -type f | head -n 1))
          echo "Building in $APP_DIR"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Locate APK
        run: find project -name app-debug.apk -print -exec cp {} app-debug.apk \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-editor-debug-apk
          path: app-debug.apk
