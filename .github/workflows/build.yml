name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: unzip -o tiktok-editor-app.zip -d project
      - name: Probe ffmpeg-kit sources
        run: |
          FILE=$(find project -name MainActivity.kt | head -n 1)
          echo "FILE=$FILE"
          grep -n "FFmpeg\|FFprobe\|ReturnCode" "$FILE" | head -n 80
          echo "=== MainActivity 250-390 ==="
          sed -n '250,390p' "$FILE"
          echo "=== github releases assets ==="
          curl -s "https://api.github.com/repos/arthenica/ffmpeg-kit/releases?per_page=3" | grep -E '"name"|"browser_download_url"' | head -n 120
          echo "=== candidate AAR HEAD ==="
          for u in https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0/ffmpeg-kit-video-6.0.aar https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0-2/ffmpeg-kit-video-6.0-2.aar https://github.com/arthenica/ffmpeg-kit/releases/download/v5.1/ffmpeg-kit-video-5.1.aar; do echo "$u"; curl -sI "$u" | head -n 6; done
          echo "=== maven central arthenica dir ==="
          curl -s https://repo.maven.apache.org/maven2/com/arthenica/ | head -n 40
          echo "=== jitpack ffmpeg-kit ==="
          curl -s https://jitpack.io/com/github/arthenica/ffmpeg-kit/6.0/ffmpeg-kit-6.0.pom | head -n 20 || true
      - name: Fix misplaced ndk block
        run: |
          perl -0777 -i -pe 's/^[ \t]*ndk[ \t]*\{[^}]*\}[ \t]*\n//gm' project/tiktok-editor-app/app/build.gradle.kts
          echo "=== after fix, lines 25-50 ==="
          cat -n project/tiktok-editor-app/app/build.gradle.kts | sed -n '25,50p'
      - name: Build debug APK
        run: |
          ls -R project | head -n 100
          APP_DIR=$(dirname $(find project -maxdepth 3 -name gradlew -type f | head -n 1))
          echo "Building in $APP_DIR"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Locate APK
        run: find project -name app-debug.apk -print -exec cp {} app-debug.apk \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-editor-debug-apk
          path: app-debug.apk
