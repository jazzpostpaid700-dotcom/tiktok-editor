name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: unzip -o tiktok-editor-app.zip -d project
      - name: Fix misplaced ndk block and ffmpeg-kit dependency
        run: |
          perl -0777 -i -pe 's/^[ \t]*ndk[ \t]*\{[^}]*\}[ \t]*\n//gm' project/tiktok-editor-app/app/build.gradle.kts
          sed -i 's/com.arthenica:ffmpeg-kit-video:6.0-2/com.arthenica:ffmpeg-kit-full:6.0.LTS/' project/tiktok-editor-app/app/build.gradle.kts
          echo "ffmpeg-kit-full pom status:"
          curl -s -o /dev/null -w "%{http_code}\n" https://repo.maven.apache.org/maven2/com/arthenica/ffmpeg-kit-full/6.0.LTS/ffmpeg-kit-full-6.0.LTS.pom
          grep ffmpeg-kit project/tiktok-editor-app/app/build.gradle.kts
      - name: Build debug APK
        run: |
          ls -R project | head -n 100
          APP_DIR=$(dirname $(find project -maxdepth 3 -name gradlew -type f | head -n 1))
          echo "Building in $APP_DIR"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Locate APK
        run: find project -name app-debug.apk -print -exec cp {} app-debug.apk \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-editor-debug-apk
          path: app-debug.apk
